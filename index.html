<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe3" />
    <meta name="description" content="코모레비 앨리 — 날씨와 계절, 향기와 길고양이가 있는 작은 골목 상점가 경영 프로토타입" />
    <title>Komorebi Alley</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="코모레비 앨리 (Komorebi Alley)" />
    <meta property="og:description" content="날씨와 계절, 가게 냄새와 길고양이로 손님 흐름을 읽는 작은 골목 경영 시뮬레이션. 브라우저에서 바로 플레이." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="brand" title="코모레비(木漏れ日): 나뭇잎 사이로 비치는 햇살">코모레비 앨리</div>
        <div class="hud-group" id="hud-when">
          <span id="hud-day" class="chip"></span>
          <span id="hud-season" class="chip"></span>
          <span id="hud-weather" class="chip"></span>
          <span id="hud-clock" class="chip clock"></span>
        </div>
        <div class="hud-group">
          <span id="hud-money" class="chip money"></span>
          <div id="hud-happy" class="happy" title="골목 행복도"><span class="happy-icon">😊</span><div class="bar"><i></i></div><b id="hud-happy-value"></b></div>
        </div>
        <div class="hud-group" id="speed" role="group" aria-label="속도">
          <button data-speed="0" title="일시정지 (Space)">⏸</button>
          <button data-speed="1" title="1배속 (1)">▶</button>
          <button data-speed="2" title="2배속 (2)">▶▶</button>
          <button data-speed="3" title="3배속 (3)">▶▶▶</button>
        </div>
        <div class="hud-group">
          <button id="btn-photo" title="엽서 찍기 (P)">📷 엽서</button>
          <button id="btn-menu" title="메뉴">☰</button>
        </div>
      </header>
      <main id="stage">
        <div id="viewport">
          <canvas id="world"></canvas>
          <canvas id="overlay"></canvas>
        </div>
        <section id="prep-card" class="card hidden" aria-live="polite"></section>
        <aside id="inspector" class="panel hidden"></aside>
        <div id="toasts" aria-live="polite"></div>
        <div id="banner" class="hidden"></div>
        <div id="modal" class="modal-backdrop hidden"><div class="modal" role="dialog" aria-modal="true"></div></div>
      </main>
      <footer id="palette"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
