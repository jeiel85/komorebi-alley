name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 먼저 시작한 배포를 끝까지 마친다
concurrency:
  group: pages
  cancel-in-progress: false

# 액션은 커밋 SHA로 고정하고 Dependabot이 갱신한다(.github/dependabot.yml)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build
        env:
          # 저장소 이름·도메인이 바뀌어도 공유 미리보기와 오류 안내 링크가 따라가게 한다(.env 기본값을 덮어씀)
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
